<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10211d" />
    <meta
      name="description"
      content="棋练是免费的中国象棋在线练习场：支持 AI 人机对弈与双人同屏，提供一步杀法、残棋定式和开局训练。"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="googlebot" content="index,follow,max-image-preview:large" />
    <meta name="author" content="棋练项目组" />
    <meta name="application-name" content="棋练" />
    <link rel="canonical" href="__CANONICAL_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="棋练" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="棋练 · 中国象棋在线对弈与 AI 训练" />
    <meta
      property="og:description"
      content="免费在线下中国象棋，支持 AI 人机与双人同屏；练习一步杀法、残棋定式和开局。无需注册，训练可离线使用。"
    />
    <meta property="og:url" content="%BASE_URL%" />
    <meta property="og:image" content="%BASE_URL%social-preview.jpg" />
    <meta property="og:image:alt" content="棋练中国象棋在线对弈与训练首页" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="棋练 · 中国象棋在线对弈与 AI 训练" />
    <meta
      name="twitter:description"
      content="免费在线下中国象棋，支持 AI 人机与双人同屏；练习一步杀法、残棋定式和开局。无需注册，训练可离线使用。"
    />
    <meta name="twitter:image" content="%BASE_URL%social-preview.jpg" />
    <meta name="twitter:image:alt" content="棋练中国象棋在线对弈与训练首页" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="棋练" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="%BASE_URL%icons/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      const basePageUrl = new URL('%BASE_URL%', window.location.origin);
      const routeInBase = window.location.pathname.startsWith(basePageUrl.pathname)
        ? window.location.pathname.slice(basePageUrl.pathname.length)
        : window.location.pathname.replace(/^\/+/, '');
      const pagePath = routeInBase.replace(/\/+$/, '');
      const sharePageUrl = new URL(pagePath, basePageUrl).href;
      const shareImageUrl = new URL('%BASE_URL%social-preview.jpg', window.location.origin).href;
      document.querySelector('meta[property="og:image"]').setAttribute('content', shareImageUrl);
      document.querySelector('meta[name="twitter:image"]').setAttribute('content', shareImageUrl);
      document.querySelector('meta[property="og:url"]').setAttribute('content', sharePageUrl);
      document.querySelector('link[rel="canonical"]').setAttribute('href', sharePageUrl);
      const pageTitle = document.querySelector('meta[property="og:title"]').content;
      const pageDescription = document.querySelector('meta[name="description"]').content;
      const pageType = /^train\/(?:tactics|endgame|opening)\/[^/]+$/.test(pagePath)
        ? 'LearningResource'
        : pagePath.startsWith('train/') || pagePath === 'local'
          ? 'CollectionPage'
          : pagePath === 'about'
            ? 'AboutPage'
            : 'WebPage';
      const graph = [
        {
          '@type': 'WebSite',
          '@id': `${sharePageUrl}#website`,
          url: sharePageUrl,
          name: '棋练',
          alternateName: '棋练中国象棋',
          description: '免费的中国象棋在线对弈与训练网站。',
          inLanguage: 'zh-CN',
        },
        {
          '@type': pageType,
          '@id': `${sharePageUrl}#webpage`,
          url: sharePageUrl,
          name: pageTitle,
          description: pageDescription,
          inLanguage: 'zh-CN',
          isAccessibleForFree: true,
          image: shareImageUrl,
        },
      ];
      if (pagePath === '') {
        graph.push({
          '@type': 'WebApplication',
          '@id': `${sharePageUrl}#application`,
          url: sharePageUrl,
          name: '棋练',
          applicationCategory: 'GameApplication',
          operatingSystem: 'Any',
          browserRequirements: 'Requires JavaScript',
          isAccessibleForFree: true,
          offers: {
            '@type': 'Offer',
            price: '0',
            priceCurrency: 'CNY',
          },
        });
      }
      const structuredData = document.createElement('script');
      structuredData.id = 'qilian-structured-data';
      structuredData.type = 'application/ld+json';
      structuredData.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@graph': graph,
      });
      document.head.appendChild(structuredData);
    </script>
    <title>棋练 · 中国象棋在线对弈与 AI 训练</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>棋练需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
